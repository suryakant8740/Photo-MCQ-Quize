name: Build Photo MCQ Quiz APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o project.zip -d .

      - name: Build APK
        run: gradle -p source/Photo-MCQ-Quize assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-MCQ-APK
          path: source/Photo-MCQ-Quize/app/build/outputs/apk/debug/*.apk
