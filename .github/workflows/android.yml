name: Build Photo MCQ Quiz APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
        packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: unzip Photo-MCQ-Quiz-Source.zip -d source

      - name: Build APK
        run: gradle -p source/Photo-MCQ-Quiz assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-MCQ-Quiz-APK
          path: source/Photo-MCQ-Quiz/app/build/outputs/apk/debug/app-debug.apk
