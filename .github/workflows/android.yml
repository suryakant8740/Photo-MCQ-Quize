name: Build Photo MCQ Quiz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p source
          unzip 'Photo-MCQ-Quiz-Source*.zip' -d source

      - name: Fix Gradle properties
        run: |
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'kotlin.code.style=official' \
            > source/Photo-MCQ-Quiz/gradle.properties

      - name: Fix Java and Kotlin versions
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' source/Photo-MCQ-Quiz/app/build.gradle.kts
          sed -i 's/jvmTarget = "17"/jvmTarget = "1.8"/g' source/Photo-MCQ-Quiz/app/build.gradle.kts

      - name: Build APK
        run: gradle -p source/Photo-MCQ-Quiz assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-MCQ-Quiz-APK
          path: source/Photo-MCQ-Quiz/app/build/outputs/apk/debug/app-debug.apk
